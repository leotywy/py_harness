[project]
name = "py-tiny-claw"
version = "0.1.0"
description = "A tiny agent engine with ReAct loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.0.0", "requests>=2.28.0"]

[project.scripts]
claw = "internal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["internal"]